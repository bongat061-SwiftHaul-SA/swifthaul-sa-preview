name: Publish isolated SwiftHaul staging preview
# Driver onboarding uploads, searchable Admin driver directory, profile-linked document review and manual verification.
# Rebuild staging preview from the latest integrated source, including Dash Rewards terms confirmation.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "SwiftHaul source branch to publish to this isolated preview"
        required: true
        default: staging/driver-upload-preview-integration
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swift-haul-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4

      - name: Check out SwiftHaul staging source
        uses: actions/checkout@v4
        with:
          repository: bongat061-SwiftHaul-SA/swifthaul-sa
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'staging/driver-upload-preview-integration' }}
          path: source

      - name: Build the three independent platform bundles
        working-directory: source
        run: node scripts/build-pages.cjs

      - name: Inject Google Maps key into the Driver staging bundle
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          node -e "const fs=require('fs');const p='source/dist/driver/map.html';const key=process.env.GOOGLE_MAPS_API_KEY;if(!key)throw new Error('Missing GOOGLE_MAPS_API_KEY repository secret');if(/[\\s<>]/.test(key))throw new Error('GOOGLE_MAPS_API_KEY contains unexpected whitespace or markup');const html=fs.readFileSync(p,'utf8');if(!html.includes('__GOOGLE_MAPS_API_KEY__'))throw new Error('Google Maps key placeholder not found in Driver map bundle');fs.writeFileSync(p,html.replaceAll('__GOOGLE_MAPS_API_KEY__',key));"

      - name: Verify all platform entry points and resumable document workflow
        run: |
          test -f source/dist/customer/customer.html
          test -f source/dist/driver/index.html
          test -f source/dist/company/index.html
          test -f source/dist/index.html
          test -f source/dist/.nojekyll
          node --check source/apps/driver/public/driver-application.js
          node --check source/public/driver-dash.js
          node --check source/apps/company/public/dash-rewards-admin.js
          node --check source/apps/company/public/driver-admin.js
          grep -Fq 'What kind of document are you uploading?' source/apps/driver/public/driver-application.js
          grep -Fq 'driver_licence' source/supabase/functions/driver-document-batch/index.ts
          grep -Fq 'Upload / retry' source/apps/driver/public/driver-application.js
          grep -Fq 'authorization:"Bearer "+sessionData.session.access_token' source/apps/driver/public/driver-application.js
          grep -Fq 'Drivers can upload their own application documents' source/supabase/migrations/20261128000400_driver_application_documents_storage_policy.sql
          grep -Fq 'driver_licence' source/apps/company/public/driver-admin.js
          grep -Fq 'Unclassified uploads' source/apps/company/public/driver-admin.js
          grep -Fq '25 per page' source/apps/company/public/driver-admin.js
          grep -Fq 'pendingUploads.filter(u=>u.driver_user_id===driver.user_id)' source/apps/company/public/driver-admin.js
          grep -Fq 'driver-admin.js?v=driver-profile-directory-20261128' source/dist/company/index.html
          grep -Fq 'app.css?v=admin-driver-directory-20261128' source/dist/company/index.html
          test -f source/dist/customer/driver-dash.js
          test -f source/dist/company/dash-rewards-admin.js
          grep -Fq 'customer-dash-rewards' source/dist/customer/driver-dash.js
          grep -Fq 'terms_version' source/dist/customer/driver-dash.js
          grep -Fq 'review_round' source/dist/company/dash-rewards-admin.js
          grep -Fq 'dash-rewards' source/dist/company/section-pages.js
          echo "Final staging verification: voucher handling, R200+ threshold, discounted Paystack totals, driver protection, subsidy accounting, cash-out forfeiture, saved keep-points choice, daily 50-point bonus, five-day 25-point streak bonus, verified round review and two-step voucher claim approval."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload isolated staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
