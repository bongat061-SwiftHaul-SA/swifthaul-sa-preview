name: Publish isolated SwiftHaul staging preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "SwiftHaul source branch to publish to this isolated preview"
        required: true
        default: feature/sa-sms-whatsapp-notifications-staging
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swift-haul-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4

      - name: Check out SwiftHaul staging source
        uses: actions/checkout@v4
        with:
          repository: bongat061-SwiftHaul-SA/swifthaul-sa
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'feature/sa-sms-whatsapp-notifications-staging' }}
          path: source

      - name: Build the three independent platform bundles
        working-directory: source
        run: node scripts/build-pages.cjs

      - name: Inject Google Maps key into the Driver staging bundle
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          node -e "const fs=require('fs');const p='source/dist/driver/map.html';const key=process.env.GOOGLE_MAPS_API_KEY;if(!key)throw new Error('Missing GOOGLE_MAPS_API_KEY repository secret');if(/[\\s<>]/.test(key))throw new Error('GOOGLE_MAPS_API_KEY contains unexpected whitespace or markup');const html=fs.readFileSync(p,'utf8');if(!html.includes('__GOOGLE_MAPS_API_KEY__'))throw new Error('Google Maps key placeholder not found in Driver map bundle');fs.writeFileSync(p,html.replaceAll('__GOOGLE_MAPS_API_KEY__',key));"

      - name: Verify all platform entry points and resumable document workflow
        run: |
          test -f source/dist/customer/customer.html
          test -f source/dist/driver/index.html
          test -f source/dist/company/index.html
          test -f source/dist/index.html
          test -f source/dist/.nojekyll
          grep -Fq 'tus-js-client@4.3.1' source/dist/driver/index.html
          grep -Fq 'driver-document-batch' source/dist/driver/driver-application.js
          grep -Fq 'driver_document_files' source/dist/driver/driver-application.js
          grep -Fq 'upload_batch_ids' source/dist/driver/driver-application.js
          grep -Fq 'driver-admin.js' source/dist/company/index.html
          grep -Fq 'classify_upload' source/dist/company/driver-admin.js
          grep -Fq 'renderPendingUploads' source/dist/company/driver-admin.js
          test -f source/dist/customer/driver-dash.js
          test -f source/dist/company/dash-rewards-admin.js
          grep -Fq 'customer-dash-rewards' source/dist/customer/driver-dash.js
          grep -Fq 'dash-rewards' source/dist/company/section-pages.js
          grep -Fq 'available_points' source/dist/customer/driver-dash.js
          grep -Fq 'request_cashout' source/dist/customer/driver-dash.js
          grep -Fq 'redeem_coupon' source/dist/customer/driver-dash.js
          grep -Fq 'list_cashouts' source/dist/company/dash-rewards-admin.js
          grep -Fq 'review_cashout' source/dist/company/dash-rewards-admin.js
          echo "Customer, Driver and Company Admin bundles verified, including resumable driver document uploads and Admin classification."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload isolated staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
