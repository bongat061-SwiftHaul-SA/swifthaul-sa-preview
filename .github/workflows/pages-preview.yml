name: Publish isolated SwiftHaul preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swift-haul-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4
      # Refresh 2026-11-07: publish the latest isolated Customer, Driver and Company preview branch · source refresh eca4deb7 · Customer, Driver and Company MapLibre integration preview.
      - name: Check out SwiftHaul source branch
        uses: actions/checkout@v4
        with:
          repository: bongat061-SwiftHaul-SA/swifthaul-sa
          ref: feature/maplibre-customer-driver-company
          path: source
      - name: Assemble three static platform entry points
        run: |
          mkdir -p site/apps/driver/public site/apps/company/public
          cp -R source/public/. site/
          cp -R source/apps/driver/public/. site/apps/driver/public/
          cp -R source/apps/company/public/. site/apps/company/public/
          touch site/.nojekyll
          test -f site/customer.html
          test -f site/apps/driver/public/index.html
          test -f site/apps/company/public/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
